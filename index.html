<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXELCRAFT STUDIO | Advanced Photo Editor</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">PIXELCRAFT <span>STUDIO</span></div>
        <nav class="menu">
            <button id="menu-upload">File ▾</button>
            <button id="menu-export">Export</button>
        </nav>
    </header>

    <div class="workspace">
        <aside class="toolbar">
            <button class="tool-btn active" data-tool="move" title="Move & Transform">✥</button>
            <button class="tool-btn" data-tool="brush" title="Brush Tool">🖌</button>
            <button class="tool-btn" data-tool="eraser" title="Eraser Tool">▱</button>
            <button class="tool-btn" data-tool="text" title="Add Text">T</button>
            <input type="color" id="tool-color" value="#ffffff">
            <input type="range" id="tool-size" min="1" max="100" value="20" title="Brush Size">
        </aside>

        <main class="canvas-area" id="drop-zone">
            <div id="start-screen">
                <h2>Drag & Drop Photos Here</h2>
                <button id="btn-start-upload" class="btn-primary">+ Upload Image</button>
            </div>
            <canvas id="main-canvas"></canvas>
        </main>

        <aside class="properties-panel">
            <div class="tabs">
                <button class="tab-btn active" data-target="panel-adjust">Adjust</button>
                <button class="tab-btn" data-target="panel-light">Light</button>
                <button class="tab-btn" data-target="panel-layers">Layers</button>
            </div>

            <div id="panel-adjust" class="panel-content active">
                <div class="slider-group"><label>Brightness</label><input type="range" data-adj="brightness" min="-100" max="100" value="0"></div>
                <div class="slider-group"><label>Contrast</label><input type="range" data-adj="contrast" min="-100" max="100" value="0"></div>
                <div class="slider-group"><label>Saturation</label><input type="range" data-adj="saturation" min="-100" max="100" value="0"></div>
                <div class="slider-group"><label>Hue</label><input type="range" data-adj="hue" min="-180" max="180" value="0"></div>
                <div class="slider-group"><label>Blur (px)</label><input type="range" data-adj="blur" min="0" max="50" value="0"></div>
                <hr>
                <h4>3D Transform</h4>
                <div class="slider-group"><label>Perspective X</label><input type="range" data-adj="rotX" min="-45" max="45" value="0"></div>
                <div class="slider-group"><label>Perspective Y</label><input type="range" data-adj="rotY" min="-45" max="45" value="0"></div>
                <hr>
                <h4>Transform</h4>
                <div class="slider-group"><label>Scale</label><input type="range" data-adj="scale" min="0.1" max="5" step="0.1" value="1"></div>
                <div class="slider-group"><label>Rotation</label><input type="range" data-adj="rotation" min="-180" max="180" value="0"></div>
            </div>

            <div id="panel-light" class="panel-content">
                <button id="btn-add-light" class="btn-secondary">+ Add Point Light</button>
                <div id="lights-container"></div>
            </div>

            <div id="panel-layers" class="panel-content">
                <div class="layer-actions">
                    <button id="btn-add-layer" title="Add Layer">+</button>
                    <button id="btn-delete-layer" title="Delete Layer">🗑</button>
                    <select id="blend-mode-select" title="Blend Mode">
                        <option value="source-over">Normal</option>
                        <option value="multiply">Multiply</option>
                        <option value="screen">Screen</option>
                        <option value="overlay">Overlay</option>
                    </select>
                </div>
                <ul id="layer-list"></ul>
            </div>
        </aside>
    </div>
    <input type="file" id="file-upload" accept="image/*" multiple hidden>

    <!-- JS Files Loaded Sequentially (NO MODULES, NO CORS ISSUES) -->
    <script src="js/layer-manager.js"></script>
    <script src="js/adjustments.js"></script>
    <script src="js/lighting.js"></script>
    <script src="js/export.js"></script>
    <script src="js/image-loader.js"></script>
    <script src="js/canvas-engine.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
